<!DOCTYPE html>
<html lang="zh-TW">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文50音 & JLPT N5 全方位學習助手</title>

    .perspective { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }

          あ

          <h1 class="font-bold text-lg leading-tight">日文50音 & N5 檢定助手</h1>
          <p class="text-xs text-indigo-200">高擬真語音・N5單字庫・文法例句・測驗</p>
        </div>
      </div>

        <i class="fas fa-trophy text-amber-400"></i>
        <span>積分：<strong id="total-score-header">0</strong></span>
      </div>
    </div>

    <!-- 語音設定控制列 (新增) -->
    <div class="bg-indigo-700/90 border-t border-indigo-500/40 px-4 py-2 text-xs">
      <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center space-x-2 flex-grow sm:flex-grow-0">
          <i class="fas fa-headset text-indigo-200"></i>

          <select id="voice-select" onchange="onVoiceChange()" class="bg-indigo-800 text-white border border-indigo-500 rounded px-2 py-1 text-xs focus:outline-none max-w-[180px] sm:max-w-[240px] truncate">
            <option value="">自動偵測最佳日語語音...</option>
          </select>
        </div>

        <div class="flex items-center space-x-3">
          <div class="flex items-center space-x-1.5">
            <span class="text-indigo-200">語速：</span>
            <button onclick="setSpeechRate(0.7)" id="rate-0.7" class="rate-btn px-2 py-0.5 rounded bg-indigo-800 text-indigo-200 hover:bg-indigo-500">慢速</button>
            <button onclick="setSpeechRate(0.88)" id="rate-0.88" class="rate-btn px-2 py-0.5 rounded bg-white text-indigo-700 font-bold">自然</button>
            <button onclick="setSpeechRate(1.05)" id="rate-1.05" class="rate-btn px-2 py-0.5 rounded bg-indigo-800 text-indigo-200 hover:bg-indigo-500">正常</button>
          </div>
          <button onclick="testVoice()" class="bg-amber-400 hover:bg-amber-300 text-indigo-950 font-bold px-2.5 py-0.5 rounded transition flex items-center space-x-1">
            <i class="fas fa-volume-up"></i>

          </button>

        <i class="fas fa-th"></i>
        <span>五十音圖表</span>

  <script>
    // ==========================================
    // 升級版高擬真日語語音合成引擎 (TTS Engine)
    // ==========================================
    let jpVoices = [];
    let selectedVoice = null;
    let currentSpeechRate = 0.88;
    let speakTimeout = null;

    // 載入並自動排序最佳日語聲優
    function loadJapaneseVoices() {
      if (!('speechSynthesis' in window)) return;
      const allVoices = window.speechSynthesis.getVoices();
      jpVoices = allVoices.filter(v => v.lang.includes('ja') || v.lang.includes('JP'));

      const selectEl = document.getElementById('voice-select');
      if (!selectEl) return;

      if (jpVoices.length === 0) {
        selectEl.innerHTML = '<option value="">系統預設日語語音</option>';
        return;
      }

      // 依自然度優先權排序（Natural / Online / Google / Apple Kyoko / O-Ren 優先）
      const priorityKeywords = ['Natural', 'Online', 'Google', 'Kyoko', 'O-Ren', 'Nanami', 'Keita', 'Haruka'];
      jpVoices.sort((a, b) => {
        const scoreA = priorityKeywords.findIndex(k => a.name.includes(k));
        const scoreB = priorityKeywords.findIndex(k => b.name.includes(k));
        const valA = scoreA === -1 ? 99 : scoreA;
        const valB = scoreB === -1 ? 99 : scoreB;
        return valA - valB;
      });

      selectEl.innerHTML = '';
      jpVoices.forEach((voice, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        // 簡化顯示名稱讓手機版更好看
        const cleanName = voice.name.replace('Microsoft ', '').replace('Google ', '').replace('Japanese', '日語');
        opt.textContent = `${cleanName} ${voice.localService ? '' : '(雲端高音質)'}`;
        selectEl.appendChild(opt);
      });

      selectedVoice = jpVoices[0];
    }

    // 監聽語音列表非同步載入完成事件（Chrome/Android 必備）
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadJapaneseVoices;
    }

    function onVoiceChange() {
      const idx = document.getElementById('voice-select').value;
      if (idx !== '' && jpVoices[idx]) {
        selectedVoice = jpVoices[idx];
        testVoice();
      }
    }

    function setSpeechRate(rate) {
      currentSpeechRate = rate;
      document.querySelectorAll('.rate-btn').forEach(btn => {
        btn.className = "rate-btn px-2 py-0.5 rounded bg-indigo-800 text-indigo-200 hover:bg-indigo-500";
      });
      const activeBtn = document.getElementById(`rate-${rate}`);
      if (activeBtn) {
        activeBtn.className = "rate-btn px-2 py-0.5 rounded bg-white text-indigo-700 font-bold";
      }
    }

    function testVoice() {
      speakJP('こんにちは。一緒に日本語を勉強しましょう。', false);
    }

    // 核心發音函式：加入緩衝與防截斷機制
    function speakJP(text, isSingleKana = false) {
      if (!('speechSynthesis' in window) || !text) return;

      // 清除前一次未完成的延遲任務
      if (speakTimeout) clearTimeout(speakTimeout);
      window.speechSynthesis.cancel();

      // 解決單一假名過短導致尾音突兀截斷的問題
      let processedText = text.trim();
      if (isSingleKana || processedText.length <= 2) {
        // 加上日文句號引導語調自然下降收尾，並預留音訊啟動緩衝
        processedText = `${processedText}。`;
      }

      speakTimeout = setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(processedText);
        utterance.lang = 'ja-JP';
        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }
        // 單音節稍微放慢一點點，聽起來更清楚飽滿
        utterance.rate = isSingleKana ? Math.max(0.75, currentSpeechRate - 0.08) : currentSpeechRate;

      },
      {
        cat: 'sentence',
        badge: '基礎句型',
        title: '～は～です / ～ではありません',
        desc: '最基礎的名詞判斷句。「です」為肯定結尾；「ではありません（口語：じゃありません）」為否定結尾。',
        examples: [
          { jp: 'あれは私の傘です。', zh: '那是我的雨傘。' },
          { jp: '田中さんは医者ではありません。', zh: '田中先生不是醫生。' }
        ]
      },
      {
        cat: 'sentence',
        badge: '基礎句型',
        title: '～があります / ～がいます (存在句)',
        desc: '表示「有某物/某人」。無生命物品、植物用「あります」；人、動物等有生命體用「います」。',
        examples: [
          { jp: '部屋にテレビがあります。', zh: '房間裡有電視。' },
          { jp: '公園に子供がいます。', zh: '公園裡有小孩。' }
        ]
      },
      {
        cat: 'sentence',
        badge: '時態變化',
        title: '動詞 ます 形四種基本時態',
        desc: '現在/未來肯定（～ます）、否定（～ません）、過去肯定（～ました）、過去否定（～ませんでした）。',
        examples: [
          { jp: '昨日テレビを見ませんでした。', zh: '昨天沒有看電視。' },
          { jp: '明日学校へ行きますか。', zh: '明天要去學校嗎？' }
        ]
      },
      {
        cat: 'sentence',
        badge: '形容詞變化',
        title: 'い形容詞過去式與否定式',
        desc: 'い形容詞變化時需去掉字尾「い」：否定改為「～くないです」，過去式改為「～かったです」。',
        examples: [
          { jp: 'この本は面白くないです。', zh: '這本書不好看（無趣）。' },
          { jp: '昨日のテストは難しかったです。', zh: '昨天的考試很難。' }
        ]
      },
      {
        cat: 'expression',
        badge: '願望句型',
        title: '動詞ます形（去ます）＋ たいです',
        desc: '表示第一人稱（我）想要做某個動作。「たい」的變化規則與「い形容詞」完全相同。',
        examples: [
          { jp: '日本へ旅行に行きたいです。', zh: '想去日本旅行。' },
          { jp: '喉が渇きました。水を飲みたいです。', zh: '口渴了，想喝水。' }
        ]
      },
      {
        cat: 'expression',
        badge: '請求與許可',
        title: '動詞 て 形 ＋ ください',
        desc: '用來禮貌地請求或指示對方做某件事，意思是「請做～」。',
        examples: [
          { jp: 'ここに名前を書いてください。', zh: '請在這裡寫上名字。' },
          { jp: 'ちょっと待ってください。', zh: '請稍等一下。' }
        ]
      }
    ];

    // --- 狀態變數 ---
    let currentScript = 'hira';
    let currentKanaType = 'seion';
    let currentVocabCat = 'all';
    let currentGrammarCat = 'all';
    let currentDeck = 'kana';
    let currentCardIndex = 0;
    let isFlipped = false;
    let quizMode = 'kana';
    let totalScore = 0;
    let quizStreak = 0;
    let currentQuizData = null;
    let quizAnswered = false;

    // --- 頁籤切換 ---
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active', 'border-b-2', 'border-indigo-600', 'text-indigo-600');
        btn.classList.add('text-slate-500');
      });

      document.getElementById(`section-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      activeBtn.classList.add('active', 'border-b-2', 'border-indigo-600', 'text-indigo-600');
      activeBtn.classList.remove('text-slate-500');

      if (tabName === 'quiz' && !currentQuizData) {
        generateQuizQuestion();
      }
    }

    // --- 1. 五十音渲染 ---
    function setScript(type) {
      currentScript = type;
      const hiraBtn = document.getElementById('script-hira');
      const kataBtn = document.getElementById('script-kata');
      if (type === 'hira') {
        hiraBtn.className = "flex-1 sm:flex-none px-6 py-1.5 rounded-md text-sm font-semibold transition bg-white text-indigo-600 shadow-sm";
        kataBtn.className = "flex-1 sm:flex-none px-6 py-1.5 rounded-md text-sm font-semibold transition text-slate-600 hover:text-indigo-600";
      } else {
        kataBtn.className = "flex-1 sm:flex-none px-6 py-1.5 rounded-md text-sm font-semibold transition bg-white text-indigo-600 shadow-sm";
        hiraBtn.className = "flex-1 sm:flex-none px-6 py-1.5 rounded-md text-sm font-semibold transition text-slate-600 hover:text-indigo-600";
      }
      renderKanaGrid();
      if (currentDeck === 'kana') updateFlashcard();
    }

    function setKanaType(type) {
      currentKanaType = type;
      ['seion', 'dakuon'].forEach(t => {
        const btn = document.getElementById(`type-${t}`);
        if (t === type) {
          btn.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg border bg-indigo-50 border-indigo-200 text-indigo-700 font-medium";
        } else {
          btn.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg border border-slate-200 text-slate-600 font-medium hover:bg-slate-50";
        }
      });
      renderKanaGrid();
    }

    function renderKanaGrid() {
      const container = document.getElementById('kana-grid-container');
      container.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = "grid grid-cols-5 gap-2 sm:gap-3";

      const list = currentKanaType === 'seion' ? seionData : dakuonData;

      list.forEach(item => {
        if (!item.hira) {
          const emptyCell = document.createElement('div');
          emptyCell.className = "bg-slate-50/40 rounded-xl min-h-[70px]";
          grid.appendChild(emptyCell);
          return;
        }

        const char = currentScript === 'hira' ? item.hira : item.kata;
        const card = document.createElement('button');
        card.onclick = () => {
          const withWord = document.getElementById('speak-with-word').checked;
          if (withWord && item.readWord) {
            speakJP(`${item.hira}、${item.readWord}`, false);
          } else {
            speakJP(item.hira, true);
          }
        };
        card.className = "group relative bg-slate-50 hover:bg-indigo-50/80 border border-slate-200 hover:border-indigo-300 rounded-xl p-3 flex flex-col items-center justify-center transition shadow-sm active:scale-95";
        card.innerHTML = `
          <span class="text-xs text-slate-400 font-medium tracking-tight mb-1 group-hover:text-indigo-500">${item.roma}</span>
          <span class="text-2xl sm:text-3xl font-bold text-slate-800 group-hover:text-indigo-600">${char}</span>
          ${item.origin ? `<span class="text-[10px] text-slate-400 mt-1">源: ${item.origin}</span>` : ''}
        `;
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }

    // --- 2. 漢字字源渲染 ---
    function renderOriginCards() {
      const container = document.getElementById('origin-cards-container');
      container.innerHTML = '';
      seionData.filter(i => i.hira !== '').forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center justify-between hover:border-indigo-200 transition";
        card.innerHTML = `
          <div class="flex items-center space-x-4">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-2xl font-bold">
              ${item.hira}
            </div>
            <div>
              <div class="font-bold text-slate-800">${item.hira} / ${item.kata} <span class="text-indigo-600 text-sm ml-1">[${item.roma}]</span></div>
              <div class="text-xs text-slate-500 mt-0.5">源自漢字：<span class="font-bold text-slate-700">${item.origin}</span> &bull; 例詞：${item.word}</div>
            </div>
          </div>
          <button onclick="speakJP('${item.hira}、${item.readWord}', false)" class="text-slate-400 hover:text-indigo-600 p-2 rounded-lg hover:bg-indigo-50">
            <i class="fas fa-volume-up"></i>
          </button>
        `;
        container.appendChild(card);
      });
    }

    // --- 3. N5 單字庫渲染 ---
    function filterVocab(cat) {
      currentVocabCat = cat;
      document.querySelectorAll('.vcat-btn').forEach(btn => {
        btn.className = "vcat-btn px-3 py-1.5 text-xs sm:text-sm rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium";
      });
      document.getElementById(`vcat-${cat}`).className = "vcat-btn px-3 py-1.5 text-xs sm:text-sm rounded-lg bg-indigo-600 text-white font-medium";
      renderVocabList();
    }

    function renderVocabList() {
      const container = document.getElementById('vocab-list-container');
      const keyword = document.getElementById('vocab-search').value.trim().toLowerCase();
      container.innerHTML = '';

      const filtered = n5VocabList.filter(item => {
        const matchCat = currentVocabCat === 'all' || item.cat === currentVocabCat;
        const matchKey = !keyword || 
          item.kana.includes(keyword) || 
          item.kanji.includes(keyword) || 
          item.meaning.toLowerCase().includes(keyword);
        return matchCat && matchKey;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">找不到符合條件的單字，請嘗試其他關鍵字。</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl p-4 border border-slate-200 shadow-sm hover:border-indigo-300 transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-indigo-50 text-indigo-600">${item.catName}</span>
              <button onclick="speakJP('${item.kana}', false)" class="text-indigo-600 hover:text-indigo-800 p-1.5 rounded-lg hover:bg-indigo-50" title="發音">
                <i class="fas fa-volume-up"></i>
              </button>
            </div>
            <div class="text-xs text-slate-500">${item.kana}</div>
            <div class="text-xl font-bold text-slate-800 mb-1">${item.kanji}</div>
            <div class="text-sm font-medium text-emerald-700 mb-3">${item.meaning}</div>
          </div>
          <div class="pt-2.5 border-t border-slate-100 text-xs text-slate-500 flex items-center justify-between">
            <span>${item.ex}</span>
            <button onclick="speakJP('${item.ex.split('(')[0]}', false)" class="text-slate-400 hover:text-indigo-600 ml-2 flex-shrink-0" title="朗讀例句">
              <i class="fas fa-play-circle text-sm"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- 4. 閃卡系統 ---
    const validKanaCards = seionData.filter(i => i.hira !== '');

    function switchDeck(deck) {
      currentDeck = deck;
      currentCardIndex = 0;
      const kanaBtn = document.getElementById('deck-kana');
      const vocabBtn = document.getElementById('deck-vocab');
      if (deck === 'kana') {
        kanaBtn.className = "flex-1 py-1.5 rounded-lg text-sm font-semibold bg-white text-indigo-600 shadow-sm transition";
        vocabBtn.className = "flex-1 py-1.5 rounded-lg text-sm font-semibold text-slate-600 hover:text-indigo-600 transition";
      } else {
        vocabBtn.className = "flex-1 py-1.5 rounded-lg text-sm font-semibold bg-white text-indigo-600 shadow-sm transition";
        kanaBtn.className = "flex-1 py-1.5 rounded-lg text-sm font-semibold text-slate-600 hover:text-indigo-600 transition";
      }
      updateFlashcard();
    }

    function flipCard() {
      isFlipped = !isFlipped;
      const inner = document.getElementById('flashcard-inner');
      if (isFlipped) {
        inner.classList.add('rotate-y-180');
      } else {
        inner.classList.remove('rotate-y-180');
      }
    }

    function updateFlashcard() {
      if (isFlipped) flipCard();

      if (currentDeck === 'kana') {
        const item = validKanaCards[currentCardIndex];
        const char = currentScript === 'hira' ? item.hira : item.kata;
        document.getElementById('card-tag').innerText = '50音清音練習';
        document.getElementById('card-main-text').innerText = char;
        document.getElementById('card-main-text').className = "text-7xl font-bold text-slate-800 tracking-wider";
        document.getElementById('card-roma-back').innerText = item.roma;
        document.getElementById('card-answer-title').innerText = `${char} (${item.roma})`;
        document.getElementById('card-answer-desc').innerText = `字源演變自漢字「${item.origin}」`;
        document.getElementById('card-example').innerText = `例詞：${item.word} — ${item.meaning}`;
        document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${validKanaCards.length}`;
      } else {
        const item = n5VocabList[currentCardIndex];
        document.getElementById('card-tag').innerText = `N5 單字 (${item.catName})`;
        document.getElementById('card-main-text').innerText = item.kanji;
        document.getElementById('card-main-text').className = "text-4xl sm:text-5xl font-bold text-slate-800 tracking-wide";
        document.getElementById('card-roma-back').innerText = item.kana;
        document.getElementById('card-answer-title').innerText = item.meaning;
        document.getElementById('card-answer-desc').innerText = `讀音：${item.kana}`;
        document.getElementById('card-example').innerText = `例句：${item.ex}`;
        document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${n5VocabList.length}`;
      }
    }

    function playCardAudio() {
      if (currentDeck === 'kana') {
        const item = validKanaCards[currentCardIndex];
        speakJP(item.hira, true);
      } else {
        speakJP(n5VocabList[currentCardIndex].kana, false);
      }
    }

    function nextCard() {
      const len = currentDeck === 'kana' ? validKanaCards.length : n5VocabList.length;
      currentCardIndex = (currentCardIndex + 1) % len;
      updateFlashcard();
    }

    function prevCard() {
      const len = currentDeck === 'kana' ? validKanaCards.length : n5VocabList.length;
      currentCardIndex = (currentCardIndex - 1 + len) % len;
      updateFlashcard();
    }

    // --- 5. 多模式隨堂測驗系統 ---
    function setQuizMode(mode) {
      quizMode = mode;
      ['kana', 'vocab-jp2zh', 'vocab-zh2jp'].forEach(m => {
        const btn = document.getElementById(`qmode-${m}`);
        if (m === mode) {
          btn.className = "flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold bg-white text-indigo-600 shadow-sm transition";
        } else {
          btn.className = "flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-600 hover:text-indigo-600 transition";
        }
      });
      generateQuizQuestion();
    }

    function generateQuizQuestion() {
      quizAnswered = false;
      document.getElementById('quiz-feedback').classList.add('hidden');
      document.getElementById('quiz-next-btn').classList.add('hidden');

      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = '';

      if (quizMode === 'kana') {
        document.getElementById('quiz-mode-badge').innerText = '五十音讀音測驗';
        document.getElementById('quiz-audio-btn').classList.remove('hidden');
        const item = validKanaCards[Math.floor(Math.random() * validKanaCards.length)];
        const char = currentScript === 'hira' ? item.hira : item.kata;
        
        currentQuizData = {
          promptText: char,
          audioText: item.hira,
          isSingleKana: true,
          correctAnswer: item.roma,
          explain: `${char} 的羅馬拼音是「${item.roma}」（字源：${item.origin}）`
        };

        document.getElementById('quiz-question').innerText = char;
        document.getElementById('quiz-question').className = "text-5xl font-bold text-slate-800";
        document.getElementById('quiz-sub-hint').innerText = "請選出正確的羅馬拼音";

        const opts = [item.roma];
        while (opts.length < 4) {
          const r = validKanaCards[Math.floor(Math.random() * validKanaCards.length)].roma;
          if (!opts.includes(r)) opts.push(r);
        }
        renderQuizOptions(opts.sort(() => Math.random() - 0.5));

      } else if (quizMode === 'vocab-jp2zh') {
        document.getElementById('quiz-mode-badge').innerText = 'N5 單字測驗 (日文 → 中文)';
        document.getElementById('quiz-audio-btn').classList.remove('hidden');
        const item = n5VocabList[Math.floor(Math.random() * n5VocabList.length)];
        const displayTitle = item.kanji === item.kana ? item.kana : `${item.kanji} (${item.kana})`;

        currentQuizData = {
          promptText: displayTitle,
          audioText: item.kana,
          isSingleKana: false,
          correctAnswer: item.meaning,
          explain: `${displayTitle} 的意思是「${item.meaning}」。例句：${item.ex}`
        };

        document.getElementById('quiz-question').innerText = displayTitle;
        document.getElementById('quiz-question').className = "text-3xl sm:text-4xl font-bold text-slate-800";
        document.getElementById('quiz-sub-hint').innerText = "請選出正確的中文意思";

        const opts = [item.meaning];
        while (opts.length < 4) {
          const r = n5VocabList[Math.floor(Math.random() * n5VocabList.length)].meaning;
          if (!opts.includes(r)) opts.push(r);
        }
        renderQuizOptions(opts.sort(() => Math.random() - 0.5));

      } else if (quizMode === 'vocab-zh2jp') {
        document.getElementById('quiz-mode-badge').innerText = 'N5 單字測驗 (中文 → 日文)';
        document.getElementById('quiz-audio-btn').classList.add('hidden');
        const item = n5VocabList[Math.floor(Math.random() * n5VocabList.length)];
        const answerLabel = item.kanji === item.kana ? item.kana : `${item.kanji} (${item.kana})`;

        currentQuizData = {
          promptText: item.meaning,
          audioText: item.kana,
          isSingleKana: false,
          correctAnswer: answerLabel,
          explain: `「${item.meaning}」的日文是 ${answerLabel}。例句：${item.ex}`
        };

        document.getElementById('quiz-question').innerText = item.meaning;
        document.getElementById('quiz-question').className = "text-3xl sm:text-4xl font-bold text-slate-800";
        document.getElementById('quiz-sub-hint').innerText = "請選出對應的日文單字";

        const opts = [answerLabel];
        while (opts.length < 4) {
          const randItem = n5VocabList[Math.floor(Math.random() * n5VocabList.length)];
          const label = randItem.kanji === randItem.kana ? randItem.kana : `${randItem.kanji} (${randItem.kana})`;
          if (!opts.includes(label)) opts.push(label);
        }
        renderQuizOptions(opts.sort(() => Math.random() - 0.5));
      }
    }

    function renderQuizOptions(options) {
      const optionsContainer = document.getElementById('quiz-options');
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "quiz-opt-btn py-3.5 px-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 font-semibold text-slate-700 hover:text-indigo-600 transition text-center text-sm sm:text-base";
        btn.innerText = opt;
        btn.onclick = () => checkQuizAnswer(opt, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function playQuizAudio() {
      if (currentQuizData && currentQuizData.audioText) {
        speakJP(currentQuizData.audioText, currentQuizData.isSingleKana);
      }
    }

    function checkQuizAnswer(selected, btnElement) {
      if (quizAnswered) return;
      quizAnswered = true;

      const isCorrect = selected === currentQuizData.correctAnswer;
      const feedback = document.getElementById('quiz-feedback');
      feedback.classList.remove('hidden');

      speakJP(currentQuizData.audioText, currentQuizData.isSingleKana);

      document.querySelectorAll('.quiz-opt-btn').forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === currentQuizData.correctAnswer) {
          btn.className = "py-3.5 px-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-700 text-center text-sm sm:text-base";
        } else if (btn === btnElement && !isCorrect) {
          btn.className = "py-3.5 px-4 rounded-xl border-2 border-rose-500 bg-rose-50 font-bold text-rose-700 text-center text-sm sm:text-base";
        } else {
          btn.className = "py-3.5 px-4 rounded-xl border border-slate-200 bg-slate-50 text-slate-400 text-center text-sm sm:text-base opacity-60";
        }
      });

      if (isCorrect) {
        totalScore += 10;
        quizStreak += 1;
        document.getElementById('total-score-header').innerText = totalScore;
        document.getElementById('quiz-streak').innerText = `${quizStreak} 題`;
        feedback.className = "text-left py-3 px-4 rounded-xl mb-4 text-sm bg-emerald-50 text-emerald-800 border border-emerald-200";
        feedback.innerHTML = `<div class="font-bold mb-1"><i class="fas fa-check-circle mr-1 text-emerald-600"></i> 答對了！(+10分)</div><div>${currentQuizData.explain}</div>`;
      } else {
        quizStreak = 0;
        document.getElementById('quiz-streak').innerText = `0 題`;
        feedback.className = "text-left py-3 px-4 rounded-xl mb-4 text-sm bg-rose-50 text-rose-800 border border-rose-200";
        feedback.innerHTML = `<div class="font-bold mb-1"><i class="fas fa-times-circle mr-1 text-rose-600"></i> 答錯囉！</div><div>${currentQuizData.explain}</div>`;
      }

      document.getElementById('quiz-next-btn').classList.remove('hidden');
    }

    // --- 6. N5 文法大全渲染 ---
    function filterGrammar(cat) {
      currentGrammarCat = cat;
      document.querySelectorAll('.gcat-btn').forEach(btn => {
        btn.className = "gcat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 whitespace-nowrap";
      });
      document.getElementById(`gcat-${cat}`).className = "gcat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap";
      renderGrammarList();
    }

    function renderGrammarList() {
      const container = document.getElementById('grammar-container');
      container.innerHTML = '';

      const filtered = n5GrammarList.filter(g => currentGrammarCat === 'all' || g.cat === currentGrammarCat);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between";
        
        const examplesHtml = item.examples.map(ex => `
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center gap-2">
            <div>
              <div class="font-bold text-slate-800 text-sm">${ex.jp}</div>
              <div class="text-xs text-slate-500 mt-0.5">${ex.zh}</div>
            </div>
            <button onclick="speakJP('${ex.jp}', false)" class="text-indigo-600 hover:text-indigo-800 p-2 rounded-lg hover:bg-indigo-100/50 flex-shrink-0" title="聆聽例句發音">
              <i class="fas fa-volume-up"></i>
            </button>
          </div>
        `).join('');

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600">${item.badge}</span>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">${item.title}</h3>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-4">${item.desc}</p>
          </div>
          <div class="space-y-2">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">實用例句</div>
            ${examplesHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- 初始化 ---
    window.onload = () => {
      loadJapaneseVoices();
      renderKanaGrid();
      renderOriginCards();
      renderVocabList();
      updateFlashcard();
      renderGrammarList();
    };
  </script>
</body>
</html>
